<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RoboDash</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#83d1ec;font-family:Arial,Helvetica,sans-serif;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.35)}
#top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start}
#stats{text-align:center;background:rgba(255,255,255,.12);padding:8px 18px;border-radius:16px}
#level{font-size:14px;letter-spacing:2px}
#score{font-size:28px;font-weight:800}
#high{font-size:14px;margin-top:4px}
#progressWrap{width:260px;max-width:55vw;height:6px;background:rgba(255,255,255,.3);border-radius:8px;margin:8px auto 0;overflow:hidden}
#progress{height:100%;width:0;background:#fff}
.btn{pointer-events:auto;background:rgba(50,65,70,.6);border:2px solid #fff;color:#fff;border-radius:12px;padding:10px 16px;font-size:18px;font-weight:700}
#gear{width:54px;height:54px;padding:0;font-size:27px}
#pause{min-width:105px}
#hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(20,35,40,.45);padding:8px 13px;border-radius:12px;font-size:13px;white-space:nowrap}

#settingsOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:20}
#settingsPanel{position:absolute;top:76px;left:34px;width:min(420px,78vw);background:rgba(18,30,33,.96);border:2px solid rgba(255,255,255,.65);border-radius:20px;padding:24px;color:#fff}
#settingsHead{display:flex;justify-content:space-between;align-items:center}
#settingsHead h2{margin:0;font-size:24px}
#closeSettings{border:0;background:transparent;color:#fff;font-size:28px}
.sectionTitle{font-size:14px;letter-spacing:1.5px;opacity:.75;margin:18px 0 10px}
#characterRow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.charBtn{border:2px solid rgba(255,255,255,.35);border-radius:10px;padding:10px 4px;color:#fff;font-size:14px;background:#666}
.charBtn.active{border-color:#fff;box-shadow:0 0 14px rgba(255,255,255,.65)}
#billyBtn{background:#777}
#bobBtn{background:#e39c0d}
#lilyBtn{background:#ee6815}
.charBtn.locked{opacity:.45}
.settingRow{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.switch{position:relative;width:54px;height:30px}
.switch input{display:none}
.slider{position:absolute;inset:0;background:#555;border-radius:18px}
.slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:#3f8df5}
.switch input:checked+.slider:before{transform:translateX(24px)}
#babyNote{text-align:center;font-size:12px;opacity:.7}

#overlay{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,.3);z-index:30}
#panel{width:min(430px,82vw);text-align:center;background:rgba(55,70,75,.92);border:2px solid #fff;border-radius:20px;padding:26px;color:#fff}
#panel h1{font-size:42px;margin:5px}
#panel h2{font-size:20px;margin:5px}
#panelBtns{display:flex;justify-content:center;gap:12px;margin-top:18px}
#retry{background:#f33}
#resume{background:#4d8b63;display:none}
</style>
</head>
<body>

<div id="ui">
  <div id="top">
    <button id="gear" class="btn">⚙</button>
    <div id="stats">
      <div id="level">LEVEL 1</div>
      <div id="score">Score: 0 / 500</div>
      <div id="progressWrap"><div id="progress"></div></div>
      <div id="high">High Score: 0</div>
    </div>
    <button id="pause" class="btn">PAUSE</button>
  </div>
  <div id="hint">← → / A D to move • ↑ / Space to jump • swipe on mobile</div>
</div>

<div id="settingsOverlay">
  <div id="settingsPanel">
    <div id="settingsHead"><h2>SETTINGS</h2><button id="closeSettings">✕</button></div>
    <div class="sectionTitle">CHARACTER SELECT</div>
    <div id="characterRow">
      <button id="billyBtn" class="charBtn active">Billy</button>
      <button id="bobBtn" class="charBtn">Bob</button>
      <button id="lilyBtn" class="charBtn">Lily</button>
      <button class="charBtn locked">Eree 🔒</button>
      <button class="charBtn locked">TMS 🔒</button>
    </div>
    <div class="sectionTitle">GAMEPLAY</div>
    <div class="settingRow"><span>🔊 Sound Effects</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
    <div class="settingRow"><span>⚡ Power Ups</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
    <div class="settingRow"><span>🔮 Energy Orbs</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
    <div class="settingRow"><span>👶 Baby Mode</span><label class="switch"><input id="babyToggle" type="checkbox"><span class="slider"></span></label></div>
    <div id="babyNote">Baby Mode = endless running with no collision game over.</div>
  </div>
</div>

<div id="overlay">
  <div id="panel">
    <h2 id="statusTitle">ROBO-DASH</h2>
    <h1 id="mainTitle">GAME OVER</h1>
    <p id="finalScore">Score: 0</p>
    <p id="newHigh"></p>
    <div id="panelBtns">
      <button id="retry" class="btn">RETRY</button>
      <button id="resume" class="btn">RESUME</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js';

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x83d1ec);
scene.fog = new THREE.Fog(0x83d1ec, 26, 95);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, .1, 160);
camera.position.set(0, 5, 8.7);
camera.lookAt(0, 2.0, -12);

scene.add(new THREE.HemisphereLight(0xffffff, 0x6d9b55, 2.7));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(8,14,7);
sun.castShadow = true;
scene.add(sun);

/* ---------- path ---------- */
const pathMat = new THREE.MeshStandardMaterial({color:0xa4ed62, roughness:1});
const edgeMat = new THREE.MeshStandardMaterial({color:0x7bc849, roughness:1});
const pathSegments = [];
const SEG_LEN = 10, SEG_COUNT = 15;

for(let i=0;i<SEG_COUNT;i++){
  const group = new THREE.Group();

  const path = new THREE.Mesh(new THREE.BoxGeometry(9.5,.35,SEG_LEN),pathMat);
  path.position.y = -.18;
  path.receiveShadow = true;
  group.add(path);

  for(const x of [-5.15,5.15]){
    const edge = new THREE.Mesh(new THREE.BoxGeometry(.8,.37,SEG_LEN),edgeMat);
    edge.position.set(x,-.19,0);
    edge.receiveShadow = true;
    group.add(edge);
  }

  for(let j=0;j<10;j++){
    const h=.25+Math.random()*.55;
    const blade=new THREE.Mesh(
      new THREE.BoxGeometry(.07,h,.07),
      new THREE.MeshStandardMaterial({color:Math.random()>.5?0x79b84a:0xb6e66c,roughness:1})
    );
    const side=Math.random()>.5?1:-1;
    blade.position.set(side*(4.0+Math.random()*1.4),h/2,(Math.random()-.5)*SEG_LEN);
    blade.rotation.z=(Math.random()-.5)*.28;
    group.add(blade);
  }

  group.position.z = -i*SEG_LEN;
  scene.add(group);
  pathSegments.push(group);
}

/* ---------- helpers ---------- */
function mesh(parent,geometry,material,x,y,z){
  const m = new THREE.Mesh(geometry,material);
  m.position.set(x,y,z);
  m.castShadow = true;
  parent.add(m);
  return m;
}

const silver = new THREE.MeshStandardMaterial({color:0xb9c1c3,metalness:.2,roughness:.55});
const silver2 = new THREE.MeshStandardMaterial({color:0x899597,metalness:.15,roughness:.55});
const antennaDark = new THREE.MeshStandardMaterial({color:0x2c3335,roughness:.65});
const red = new THREE.MeshStandardMaterial({color:0xe9232c,roughness:.5});

/* ---------- BILLY ---------- */
const billy = new THREE.Group();
billy.position.set(0,0,2.4);
scene.add(billy);

const billyTorso = mesh(billy,new THREE.BoxGeometry(1.35,1.55,.82),silver,0,2.15,0);
mesh(billy,new THREE.BoxGeometry(1.08,.86,.8),silver,0,3.46,0);
mesh(billy,new THREE.BoxGeometry(1.42,.18,.85),silver2,0,2.92,0);
mesh(billy,new THREE.CylinderGeometry(.055,.055,.5,12),antennaDark,0,4.14,0);
mesh(billy,new THREE.SphereGeometry(.18,16,12),red,0,4.45,0);

const billyLA = new THREE.Group(), billyRA = new THREE.Group();
billyLA.position.set(-.88,2.72,0);
billyRA.position.set(.88,2.72,0);
billy.add(billyLA,billyRA);

/* Billy arms are SILVER, not black */
mesh(billyLA,new THREE.BoxGeometry(.34,1.0,.4),silver,0,-.47,0);
mesh(billyRA,new THREE.BoxGeometry(.34,1.0,.4),silver,0,-.47,0);
mesh(billyLA,new THREE.BoxGeometry(.4,.33,.43),silver2,0,-1.02,0);
mesh(billyRA,new THREE.BoxGeometry(.4,.33,.43),silver2,0,-1.02,0);

const billyLL = new THREE.Group(), billyRL = new THREE.Group();
billyLL.position.set(-.36,1.42,0);
billyRL.position.set(.36,1.42,0);
billy.add(billyLL,billyRL);

/* Billy legs are SILVER, not black */
mesh(billyLL,new THREE.BoxGeometry(.42,1.16,.5),silver,0,-.53,0);
mesh(billyRL,new THREE.BoxGeometry(.42,1.16,.5),silver,0,-.53,0);
mesh(billyLL,new THREE.BoxGeometry(.52,.31,.72),silver2,0,-1.13,-.12);
mesh(billyRL,new THREE.BoxGeometry(.52,.31,.72),silver2,0,-1.13,-.12);

/* ---------- BOB ---------- */
const bobYellow = new THREE.MeshStandardMaterial({color:0xf1dc25,roughness:.6});
const bobOrange = new THREE.MeshStandardMaterial({color:0xe95e13,roughness:.6});
const bobDark = new THREE.MeshStandardMaterial({color:0x222222,roughness:.8});

const bob = new THREE.Group();
bob.position.set(0,0,2.4);
bob.visible = false;
scene.add(bob);

const bobBody = mesh(bob,new THREE.SphereGeometry(.78,24,18),bobOrange,0,1.75,0);
bobBody.scale.set(.88,1.25,.72);

const bobHead = mesh(bob,new THREE.SphereGeometry(.83,28,20),bobYellow,0,3.05,0);
bobHead.scale.z=.92;

const bobLA=new THREE.Group(),bobRA=new THREE.Group();
bobLA.position.set(-.78,2.15,0);
bobRA.position.set(.78,2.15,0);
bob.add(bobLA,bobRA);
mesh(bobLA,new THREE.BoxGeometry(.28,.82,.34),bobYellow,0,-.32,0);
mesh(bobRA,new THREE.BoxGeometry(.28,.82,.34),bobYellow,0,-.32,0);

/* Bob's normal Robodex legs/feet:
   two yellow oval RINGS with transparent/open centers */
const bobLeftLeg=new THREE.Group(), bobRightLeg=new THREE.Group();
bobLeftLeg.position.set(-.35,.92,0);
bobRightLeg.position.set(.35,.92,0);
bob.add(bobLeftLeg,bobRightLeg);

const bobLeftFoot=mesh(
  bobLeftLeg,
  new THREE.TorusGeometry(.34,.12,14,28),
  bobYellow,
  0,-.24,.03
);
bobLeftFoot.scale.set(.92,1.28,.78);
bobLeftFoot.rotation.x=Math.PI/2;

const bobRightFoot=mesh(
  bobRightLeg,
  new THREE.TorusGeometry(.34,.12,14,28),
  bobYellow,
  0,-.24,.03
);
bobRightFoot.scale.set(.92,1.28,.78);
bobRightFoot.rotation.x=Math.PI/2;

/* ---------- LILY ---------- */
const lilyOrange = new THREE.MeshStandardMaterial({color:0xe86714,roughness:.62});
const lilyBrown = new THREE.MeshStandardMaterial({color:0x4a2815,roughness:.72});

const lily = new THREE.Group();
lily.position.set(0,0,2.4);
lily.visible = false;
scene.add(lily);

const lilyBody=mesh(lily,new THREE.CylinderGeometry(.48,.72,1.75,18),lilyOrange,0,1.55,0);
lilyBody.scale.z=.78;

const lilyHair=mesh(lily,new THREE.CylinderGeometry(.52,1.08,1.55,18),lilyBrown,0,2.75,0);
lilyHair.scale.z=.82;

const lilyLA=new THREE.Group(),lilyRA=new THREE.Group();
lilyLA.position.set(-.72,2.0,0);
lilyRA.position.set(.72,2.0,0);
lily.add(lilyLA,lilyRA);
mesh(lilyLA,new THREE.BoxGeometry(.22,.92,.28),lilyOrange,0,-.36,0);
mesh(lilyRA,new THREE.BoxGeometry(.22,.92,.28),lilyOrange,0,-.36,0);

/* ---------- game state ---------- */
const characters={Billy:billy,Bob:bob,Lily:lily};
let activeName='Billy';
let lane=1,targetX=0;
const lanes=[-2.5,0,2.5];
let yVel=0,grounded=true;
let running=true,gameOver=false,settingsOpen=false;
let score=0,level=1,speed=13,spawnTimer=.9,elapsed=0;
let babyMode=false;
let highScore=Number(localStorage.getItem('robodashHigh')||0);
const obstacles=[];

function currentRunner(){ return characters[activeName]; }

function selectCharacter(name){
  activeName=name;
  for(const [key,obj] of Object.entries(characters)) obj.visible = key===name;

  document.getElementById('billyBtn').classList.toggle('active',name==='Billy');
  document.getElementById('bobBtn').classList.toggle('active',name==='Bob');
  document.getElementById('lilyBtn').classList.toggle('active',name==='Lily');

  const r=currentRunner();
  r.position.x=targetX;
  r.position.y=0;
  r.position.z=2.4;
  yVel=0;
  grounded=true;
}

document.getElementById('billyBtn').onclick=()=>selectCharacter('Billy');
document.getElementById('bobBtn').onclick=()=>selectCharacter('Bob');
document.getElementById('lilyBtn').onclick=()=>selectCharacter('Lily');

/* ---------- obstacle ---------- */
const wood=new THREE.MeshStandardMaterial({color:0x9b7549,roughness:.8});
const stone=new THREE.MeshStandardMaterial({color:0x777777,roughness:.8});

function spawnObstacle(){
  const o=new THREE.Mesh(
    Math.random()<.5 ? new THREE.BoxGeometry(1.55,1.05,1) : new THREE.BoxGeometry(1.6,1.6,1),
    Math.random()<.5 ? wood : stone
  );
  o.userData.lane=Math.floor(Math.random()*3);
  o.position.x=lanes[o.userData.lane];
  o.position.y=o.geometry.parameters.height/2;
  o.position.z=-67;
  o.castShadow=true;
  scene.add(o);
  obstacles.push(o);
}

/* ---------- input ---------- */
function move(dir){
  if(!running||settingsOpen||gameOver)return;
  lane=Math.max(0,Math.min(2,lane+dir));
  targetX=lanes[lane];
}
function jump(){
  if(running&&!settingsOpen&&!gameOver&&grounded){
    yVel=9.5;
    grounded=false;
  }
}

addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);
  if(e.key==='ArrowUp'||e.key===' '||e.key.toLowerCase()==='w')jump();
});

let touchStart=null;
addEventListener('touchstart',e=>{
  const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY};
},{passive:true});
addEventListener('touchend',e=>{
  if(!touchStart||settingsOpen)return;
  const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>35)move(dx>0?1:-1);
  else if(dy<-25||Math.abs(dx)<18)jump();
  touchStart=null;
},{passive:true});

/* ---------- settings ---------- */
document.getElementById('gear').onclick=()=>{
  if(gameOver)return;
  settingsOpen=true;
  document.getElementById('settingsOverlay').style.display='block';
};
document.getElementById('closeSettings').onclick=()=>{
  settingsOpen=false;
  document.getElementById('settingsOverlay').style.display='none';
};
document.getElementById('babyToggle').onchange=e=>babyMode=e.target.checked;

/* ---------- pause ---------- */
function togglePause(){
  if(settingsOpen||gameOver)return;
  running=!running;
  if(!running){
    document.getElementById('statusTitle').textContent='ROBO-DASH';
    document.getElementById('mainTitle').textContent='PAUSED';
    document.getElementById('finalScore').textContent='Score: '+Math.floor(score);
    document.getElementById('retry').style.display='none';
    document.getElementById('resume').style.display='inline-block';
    document.getElementById('overlay').style.display='flex';
  }else{
    document.getElementById('overlay').style.display='none';
  }
}
document.getElementById('pause').onclick=togglePause;
document.getElementById('resume').onclick=togglePause;

/* ---------- game over ---------- */
function endGame(){
  if(babyMode)return;
  gameOver=true;
  running=false;
  const s=Math.floor(score);
  let msg='';
  if(s>highScore){
    highScore=s;
    localStorage.setItem('robodashHigh',highScore);
    msg='New High Score!';
  }
  document.getElementById('statusTitle').textContent='SUPER JUMP!';
  document.getElementById('mainTitle').textContent='GAME OVER';
  document.getElementById('finalScore').textContent='Score: '+s;
  document.getElementById('newHigh').textContent=msg;
  document.getElementById('retry').style.display='inline-block';
  document.getElementById('resume').style.display='none';
  document.getElementById('overlay').style.display='flex';
}

function reset(){
  obstacles.forEach(o=>scene.remove(o));
  obstacles.length=0;
  lane=1;targetX=0;
  for(const c of Object.values(characters))c.position.set(0,0,2.4);
  yVel=0;grounded=true;
  score=0;level=1;speed=13;spawnTimer=.9;elapsed=0;
  gameOver=false;running=true;settingsOpen=false;
  document.getElementById('overlay').style.display='none';
  document.getElementById('settingsOverlay').style.display='none';
}
document.getElementById('retry').onclick=reset;

/* ---------- animation ---------- */
const clock=new THREE.Clock();

function animate(){
  const dt=Math.min(clock.getDelta(),.035);

  if(running&&!gameOver&&!settingsOpen){
    elapsed+=dt;
    level=1+Math.floor(score/500);
    speed=Math.min(25,13+(level-1)*1.2+elapsed*.02);
    score+=dt*speed*.9;

    const runner=currentRunner();

    runner.position.x+=(targetX-runner.position.x)*Math.min(1,dt*12);

    yVel-=22*dt;
    runner.position.y+=yVel*dt;
    if(runner.position.y<=0){
      runner.position.y=0;
      yVel=0;
      grounded=true;
    }

    /* CLEAR, VISIBLE RUNNING ANIMATION */
    const phase=elapsed*10.5;

    if(activeName==='Billy'){
      billyLA.rotation.x=Math.sin(phase)*.95;
      billyRA.rotation.x=-Math.sin(phase)*.95;
      billyLL.rotation.x=-Math.sin(phase)*.95;
      billyRL.rotation.x=Math.sin(phase)*.95;
      billyTorso.position.y=2.15+Math.abs(Math.sin(phase))*0.05;
    }
    if(activeName==='Bob'){
      bobLA.rotation.x=Math.sin(phase)*.75;
      bobRA.rotation.x=-Math.sin(phase)*.75;
      bobLeftLeg.rotation.x=-Math.sin(phase)*.42;
      bobRightLeg.rotation.x=Math.sin(phase)*.42;
      bobBody.rotation.z=Math.sin(phase*2)*.035;
      bob.position.y+=Math.abs(Math.sin(phase))*0.015;
    }
    if(activeName==='Lily'){
      lilyLA.rotation.x=Math.sin(phase)*.72;
      lilyRA.rotation.x=-Math.sin(phase)*.72;
      lilyBody.rotation.z=Math.sin(phase*2)*.035;
      lilyHair.rotation.z=-Math.sin(phase*2)*.018;
    }

    for(const p of pathSegments){
      p.position.z+=speed*dt;
      if(p.position.z>10)p.position.z-=SEG_COUNT*SEG_LEN;
    }

    spawnTimer-=dt;
    if(spawnTimer<=0){
      spawnObstacle();
      spawnTimer=Math.max(.7,1.25-level*.03)+Math.random()*.4;
    }

    const boxSize=activeName==='Bob'
      ? new THREE.Vector3(1.25,3.4,.9)
      : activeName==='Lily'
        ? new THREE.Vector3(1.35,3.35,.88)
        : new THREE.Vector3(1.05,3.45,.75);

    const playerBox=new THREE.Box3().setFromCenterAndSize(
      new THREE.Vector3(runner.position.x,runner.position.y+1.85,runner.position.z),
      boxSize
    );

    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      o.position.z+=speed*dt;
      if(o.position.z>12){
        scene.remove(o);
        obstacles.splice(i,1);
        continue;
      }
      if(!babyMode){
        const ob=new THREE.Box3().setFromObject(o);
        if(playerBox.intersectsBox(ob)){
          endGame();
          break;
        }
      }
    }

    camera.position.x+=(runner.position.x*.17-camera.position.x)*Math.min(1,dt*5);
  }

  const s=Math.floor(score);
  document.getElementById('level').textContent='LEVEL '+level;
  document.getElementById('score').textContent='Score: '+s+' / '+(level*500);
  document.getElementById('high').textContent='High Score: '+Math.max(highScore,s);
  document.getElementById('progress').style.width=((s%500)/500*100)+'%';

  renderer.render(scene,camera);
}

renderer.setAnimationLoop(animate);

/* render once immediately so Billy is visible BEFORE touching settings */
renderer.render(scene,camera);

addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
